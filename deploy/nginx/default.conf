# nginx перед магазином: Django (API, админка, статика, медиа) + SSR-фронтенд.
upstream django   { server app:8000; }
upstream frontend { server frontend:3000; }

# Схема, с которой пришёл браузер: за внешним прокси с https (Caddy на сервере) — его X-Forwarded-Proto,
# без прокси (ноутбук) — своя. Иначе Django считает https-запросы обычными http.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# SSR-фронтенд (react-router-serve) не доверяет прокси и видит адрес страницы как http://домен.
# React Router сверяет его с Origin формы и отклоняет вход и регистрацию как подделку (400 Bad Request).
# Свой же https://домен приводим к http://домен; чужие Origin не трогаем — их он по-прежнему отклоняет.
map "$http_origin|$host" $frontend_origin {
    "~^https://([^|/]+)\|\1$" "http://$host";
    default                   $http_origin;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 55m;   # накладные (≤10 МБ), шаблон товаров (≤20 МБ), файл прайса поставщика (≤50 МБ)

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;

    # Django: API, админка, allauth
    location ~ ^/(api|admin|account)/ {
        proxy_pass http://django;
        proxy_read_timeout 120s;
    }

    # Статика Django (admin, DRF)
    location /django-static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    # Уменьшенные копии фото (WebP): готовую отдаём сами, нет — Django сделает один раз и положит рядом
    location /media/thumbs/ {
        root /usr/share/nginx;
        expires 30d;
        try_files $uri @thumb;
    }
    location @thumb {
        proxy_pass http://django;
    }

    # Фото товаров. Накладные лежат в приватном хранилище и сюда не попадают.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 1d;
    }

    # Хэшированные ассеты сборки фронтенда — кэш навсегда
    location /assets/ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Всё остальное — SSR-страницы магазина
    location / {
        proxy_pass http://frontend;
        proxy_read_timeout 120s;   # загрузка и разбор файлов импорта в кабинете
        # свой proxy_set_header в location отменяет общие — повторяем их
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header Origin $frontend_origin;
    }

    location ~ /\. {
        deny all;
    }
}
