# nginx перед магазином: Django (API, админка, статика, медиа) + SSR-фронтенд.
upstream django   { server app:8000; }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 12m;   # загрузка накладных (≤10 МБ) и фото

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Django: API, админка, allauth
    location ~ ^/(api|admin|account)/ {
        proxy_pass http://django;
        proxy_read_timeout 120s;
    }

    # Статика Django (admin, DRF)
    location /django-static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    # Фото товаров. Накладные лежат в приватном хранилище и сюда не попадают.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 1d;
    }

    # Хэшированные ассеты сборки фронтенда — кэш навсегда
    location /assets/ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Всё остальное — SSR-страницы магазина
    location / {
        proxy_pass http://frontend;
    }

    location ~ /\. {
        deny all;
    }
}
