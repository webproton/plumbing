[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", "frontend", "node_modules", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # длину строк контролирует форматер
    "B008",
    "B904",
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"config/settings_test.py" = ["F403", "F405", "E402"]
"**/tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "parsers"]
