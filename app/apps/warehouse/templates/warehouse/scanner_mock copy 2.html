<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Временный пульт сканера Ruidida</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f4f6f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        input:focus { border-color: #4a90e2; outline: none; background: #f0f7ff; }
        #log { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; font-weight: bold; }
        .success { background: #e2f0d9; color: #385723; border: 1px solid #c5e0b4; }
        .error { background: #fce4d6; color: #c65911; border: 1px solid #f8cbad; }
        .info { background: #fff2cc; color: #7f6000; border: 1px solid #ffe699; }
        .status-badge { display: inline-block; padding: 4px 8px; background: #4a90e2; color: white; border-radius: 4px; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>📻 Временный терминал сканера</h2>
    <p style="color: #666; font-size: 14px;">Поставьте курсор в поле «Штрихкод» и пикните товар сканером Ruidida.</p>
    
    {% csrf_token %}

    <div class="form-group">
        <label for="warehouse_id">ID Склада:</label>
        <input type="number" id="warehouse_id" value="1" placeholder="Введите ID склада">
    </div>

    <div class="form-group">
        <label for="document_id">ID Документа (Накладной):</label>
        <input type="number" id="document_id" value="1" placeholder="Введите ID документа">
    </div>

    <div class="form-group">
        <label for="barcode">Штрихкод:</label>
        <input type="text" id="barcode" placeholder="Сюда пойдет ввод со сканера..." autofocus autocomplete="off">
        <span class="status-badge" id="scan_mode">Режим: Ожидание сканирования</span>
    </div>

    <div id="log"></div>
</div>

<script>
const barcodeInput = document.getElementById('barcode');
const warehouseInput = document.getElementById('warehouse_id');
const documentInput = document.getElementById('document_id');
const logDiv = document.getElementById('log');
const scanModeBadge = document.getElementById('scan_mode');
const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

function showLog(message, type) {
    logDiv.className = type;
    logDiv.innerHTML = message;
    logDiv.style.display = 'block';
}

barcodeInput.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault(); 
        
        const barcode = barcodeInput.value.trim();
        // Берем значения прямо в момент сканирования!
        const warehouseId = parseInt(warehouseInput.value.trim());
        const documentId = parseInt(documentInput.value.trim());

        if (!barcode) return;
        if (!warehouseId || !documentId) {
            showLog("⚠️ Пожалуйста, введите корректные ID склада и документа (не 0)!", "error");
            return;
        }

        scanModeBadge.textContent = "Отправка...";
        scanModeBadge.style.background = "#ff9900";

        // Важно: в конце / обязателен для DRF
        const url = `/api/warehouse/inventory-documents/${documentId}/scan/`;

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({
                barcode: barcode,
                warehouse: warehouseId
            })
        })
        .then(response => {
            // Читаем json и передаем дальше статус ответа сервера
            return response.json().then(data => ({ status: response.status, body: data }));
        })
        .then(result => {
            if (result.status === 200) {
                // Товар найден и прибавлен в базу
                showLog(`✅ Успешно: <b>${result.body.name}</b><br>Артикул: ${result.body.sku}<br>В документе: ${result.body.current_doc_qty} шт.`, 'success');
            } else if (result.status === 404) {
                // Сработал ObjectDoesNotExist в твоемьюсете!
                showLog(`❓ <b>Товар не зарегистрирован!</b><br>Штрихкод: ${barcode}<br>Сообщение бэкенда: ${result.body.message || 'Открыть форму создания нового товара?'}`, 'info');
            } else {
                // Любая другая ошибка (например, склад не найден)
                showLog(`❌ Ошибка бэкенда (${result.status}): ${result.body.error || 'Что-то пошло не так'}`, 'error');
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
            showLog('💥 Ошибка соединения с сервером Django или неверный URL (404 сервера)', 'error');
        })
        .finally(() => {
            barcodeInput.value = '';
            barcodeInput.focus();
            scanModeBadge.textContent = "Режим: Ожидание сканирования";
            scanModeBadge.style.background = "#4a90e2";
        });
    }
});
    // Если кликнули мимо — возвращаем фокус в поле ввода при любом клике по карточке
    document.querySelector('.card').addEventListener('click', () => {
        barcodeInput.focus();
    });
</script>

</body>
</html>
