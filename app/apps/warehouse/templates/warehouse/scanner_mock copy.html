<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск товара по сканеру</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f4f6f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 14px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; font-size: 18px; }
        input:focus { border-color: #3498db; outline: none; background: #f0f7ff; }
        #log { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-size: 16px; line-height: 1.5; }
        
        /* Стили для разных ответов бэкенда */
        .found { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .not_found { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .badge { display: inline-block; padding: 4px 8px; background: #3498db; color: white; border-radius: 4px; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔍 Глобальный поиск товара (Сканер Ruidida)</h2>
    <p style="color: #7f8c8d; font-size: 14px;">Поиск идет по всей базе данных (Штрихкод / SKU / Артикул).</p>
    
    {% csrf_token %}

    <div class="form-group">
        <label for="query">Сканируйте штрихкод товара:</label>
        <input type="text" id="query" placeholder="Пикните сканером сюда..." autofocus autocomplete="off">
        <span class="badge" id="status_badge">Статус: Ожидание сканирования</span>
    </div>

    <div id="log"></div>
</div>

<script>
    const queryInput = document.getElementById('query');
    const logDiv = document.getElementById('log');
    const statusBadge = document.getElementById('status_badge');
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    function showResult(message, className) {
        logDiv.className = className;
        logDiv.innerHTML = message;
        logDiv.style.display = 'block';
    }

    queryInput.addEventListener('keydown', function(event) {
        // Ловим Enter от сканера Ruidida
        if (event.key === 'Enter') {
            event.preventDefault(); // Отменяем перезагрузку страницы

            const scanValue = queryInput.value.trim();
            if (!scanValue) return;

            statusBadge.textContent = "Ищу в базе...";
            statusBadge.style.background = "#e67e22";

            // Твой эндпоинт поиска во ViewSet движений (StockMovementViewSet)
            const url = '/api/warehouse/stock-movements/find_by_barcode_or_sku/';

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                // Твой бэкенд ожидает поле "query" в request.data
                body: JSON.stringify({ query: scanValue })
            })
            .then(response => {
                // DRF на статус 404 всё равно вернет JSON, который мы должны прочитать
                return response.json().then(data => ({ status: response.status, body: data }));
            })
            .then(result => {
                if (result.status === 200) {
                    // Товар найден (Бэкенд вернул status: "found")
                    const t = result.body;
                    showResult(`
                        <b>✅ Товар найден в системе!</b><br>
                        • <b>Название:</b> ${t.name}<br>
                        • <b>SKU/Артикул:</b> ${t.sku || '—'}<br>
                        • <b>Штрихкод:</b> ${t.barcode || '—'}<br>
                        • <b>ID Варианта:</b> ${t.variant_id}<br>
                        • <b>Цена:</b> ${t.price} грн.
                    `, 'found');
                } else if (result.status === 404) {
                    // Товар НЕ найден (Бэкенд вернул status: "not_found")
                    showResult(`
                        <b>❓ Товар не зарегистрирован</b><br>
                        ${result.body.message}<br>
                        • Считанный код: <code>${result.body.query}</code><br>
                        <br>
                        <button onclick="alert('Тут можно открыть форму создания для кода: ' + '${result.body.query}')" style="padding: 5px 10px; cursor:pointer;">
                            ➕ Создать карточку товара
                        </button>
                    `, 'not_found');
                } else {
                    // Какая-то другая ошибка сервера (500, 400 и т.д.)
                    showResult(`❌ Ошибка сервера (${result.status}): ${result.body.error || 'Что-то пошло не так'}`, 'error');
                }
            })
            .catch(error => {
                console.error('Ошибка запроса:', error);
                showResult('💥 Ошибка соединения с Django бэкендом.', 'error');
            })
            .finally(() => {
                // Очищаем инпут и возвращаем фокус сканеру для следующего пика
                queryInput.value = '';
                queryInput.focus();
                statusBadge.textContent = "Статус: Ожидание сканирования";
                statusBadge.style.background = "#3498db";
            });
        }
    });

    // Держим фокус на поле ввода, если кликнули по экрану
    document.addEventListener('click', () => {
        queryInput.focus();
    });
</script>

</body>
</html>
