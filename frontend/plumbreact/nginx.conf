# --- определяем, кто бот ---
map $http_user_agent $is_bot {
    default 0;
    "~*googlebot|bingbot|yandex|baiduspider|facebookexternalhit|twitterbot" 1;
}

server {
    listen 80;
    server_name localhost;

    # Путь к React build
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Прячем заголовки (безопасность)
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    error_page 418 = @prerender;

    # Главная и SPA маршруты
    location / {
        # если бот — отправляем на prerender
        if ($is_bot) {
            return 418;
        }

        try_files $uri /index.html;
    }

    # Обработка для prerender (SSR для ботов)
    location @prerender {
        proxy_pass http://prerender:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-Url $scheme://$host$request_uri;
        proxy_http_version 1.1;
    }

    # Django API
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django админка
    location /admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Медиа файлы
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Django static files
    location /django-static/ {
        alias /usr/share/nginx/static/;
    }

    # React static
    location /static/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
    }

    # Sitemap
    location = /sitemap.xml {
        proxy_pass http://app:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Запрет доступа к .env и скрытым файлам
    location ~ /\.env {
        deny all;
    }
}
