server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;   # загрузка накладных (≤10 МБ) и фото

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Django: API и админка
    location ~ ^/(api|admin|account)/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Статика Django (admin, DRF)
    location /django-static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    # Публичные медиа (фото товаров). Накладные хранятся отдельно и наружу не отдаются.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 1d;
    }

    # Хэшированные ассеты сборки — кэш навсегда
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}
