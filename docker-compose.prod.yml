version: "3.9"

services:
  db:
    image: postgis/postgis:14-3.2
    env_file:
      - .env
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data

  pgbouncer:
    image: edoburu/pgbouncer
    env_file:
    - .env
    ports:
    - "${PGBOUNCER_PORT}:6432"
    depends_on:
      - db
  redis:
    image: redis:7
    # ports:
    #   - "6379:6379"
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    expose:
      - "8000"
    # ports:
    #   - "8000:8000"
    volumes:
      - ./staticfiles:/code/staticfiles
      - ./app/media:/code/media

  frontend:
    build:
      context: ./frontend/plumbreact
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api   # ✅ а не http://app:8000

    depends_on:
      - app
    # Порт не нужен, всё через Nginx
  prerender:
    build:
      context: ./prerender
      dockerfile: Dockerfile
    # platform: linux/amd64
    # container_name: prerender
    shm_size: 2gb
    restart: always
    # ports:
    #   - "3001:3000"
      
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - app
      - prerender
    volumes:
      - ./frontend/plumbreact/build:/usr/share/nginx/html:ro
      - ./staticfiles:/usr/share/nginx/static:ro
      - ./app/media:/usr/share/nginx/media:ro
      - ./frontend/plumbreact/nginx.conf:/etc/nginx/conf.d/default.conf
      #- ./certs:/etc/nginx/certs:ro  # если будут сертификаты
