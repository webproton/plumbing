# Production-окружение: docker compose -f docker-compose.prod.yml up -d --build
# Секреты и настройки — в .env (см. .env.example). Хосты БД/Redis задаются здесь.

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: plumbing-backend
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/2
    TRUSTED_PROXY: "True"
    DJANGO_INTERNAL_HOSTS: app
  volumes:
    - static:/code/staticfiles
    - ./app/media:/code/media
    - private_media:/code/private_media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:14-3.2
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Одноразовый сервис: миграции + сборка статики перед стартом app
  migrate:
    <<: *backend
    command: >
      sh -c "python app/manage.py migrate --noinput &&
             python app/manage.py collectstatic --noinput"
    restart: "no"

  app:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Фоновые задачи: импорт товаров, синхронизация поставщиков, уведомления
  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Расписание (только один экземпляр!): синхронизация поставщиков по интервалу
  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://app:8000
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SITE_NAME: ${SITE_NAME:-LUXORA}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # true — только для запуска без HTTPS (cookie без флага Secure)
      INSECURE_COOKIES: ${INSECURE_COOKIES:-false}
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/usr/share/nginx/static:ro
      - ./app/media:/usr/share/nginx/media:ro
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  static:
  private_media:
