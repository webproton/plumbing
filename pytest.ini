[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
pythonpath = . app
testpaths = app
python_files = tests.py test_*.py *_tests.py
# --ds сильнее переменной окружения: в Docker-образе стоит DJANGO_SETTINGS_MODULE=config.settings,
# без флага тесты шли бы на боевых настройках (язык uk, письма в очередь без воркера)
addopts = --ds=config.settings_test --reuse-db -p no:cacheprovider
